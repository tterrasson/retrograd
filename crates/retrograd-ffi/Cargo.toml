[package]
name = "retrograd-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Retrograd - raw FFI to the C++ runtime and the build of the llama.cpp fork"
publish = false
build = "build.rs"
links = "retro_runtime"
# What `cargo package --list` reports, and so what the Python sdist copies: the
# build inputs, not the whole submodule. Of the fork, `build.rs` and
# `runtime/CMakeLists.txt` read the top-level CMake project and these six
# directories - tests, examples, tools and the app are switched off - so its
# models (vocabulary GGUFs), docs, conversion scripts and any local build tree
# stay out. A new directory the build starts reading has to be added here.
include = [
    "/build.rs",
    "/build/**",
    "/src/**",
    "/runtime/CMakeLists.txt",
    "/runtime/include/**",
    "/runtime/src/**",
    "/runtime/llama.cpp.lock",
    "/runtime/third_party_notes/**",
    "/runtime/vendor/llama.cpp/CMakeLists.txt",
    "/runtime/vendor/llama.cpp/LICENSE",
    "/runtime/vendor/llama.cpp/cmake/**",
    "/runtime/vendor/llama.cpp/common/**",
    "/runtime/vendor/llama.cpp/ggml/**",
    "/runtime/vendor/llama.cpp/include/**",
    "/runtime/vendor/llama.cpp/src/**",
    "/runtime/vendor/llama.cpp/vendor/**",
]

[features]
# CPU is always compiled. Only the user-facing packages enable this by default.
# Metal on macOS, nothing elsewhere
platform-gpu = []
metal = []
vulkan = []
cuda = []

[dependencies]

[lints]
workspace = true
