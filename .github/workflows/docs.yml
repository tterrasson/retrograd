name: Docs

# Builds the VitePress site in docs/ and deploys it to GitHub Pages.

# Runs on pushes to main that touch the documentation, and by hand from "Run
# workflow" in Actions or `gh workflow run docs.yml`.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

# Deployment to Pages needs `pages: write` and an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Runs queued behind the one in progress are skipped
# for the latest, but a deployment already started is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (vitepress)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      # No submodules: the site reads nothing outside docs/.
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      # Publishes the path the site is served under: `/retrograd` for a project
      # site, empty behind a custom domain.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A dead link between pages fails this step.
      - name: Build with VitePress
        run: bun run docs:build
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: deploy (github pages)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
