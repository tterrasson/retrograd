[package]
name = "rir-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "RIR - runs the generated shaders on a real Vulkan device"

[dependencies]
thiserror.workspace = true
# Load Vulkan dynamically so builds need no SDK and a missing driver remains a
# recoverable runtime error.
ash = { version = "0.38", default-features = false, features = ["loaded"] }
serde.workspace = true
serde_json.workspace = true
# Read quantized block geometry from the canonical table.
rir-core.workspace = true
# Compile CUDA with `nvcc -shared` and load it dynamically. A missing toolkit
# remains recoverable, like a missing Vulkan driver.
#
# Held at 0.8, which is not the latest: `ash` depends on it to open
# `libvulkan`, and 0.8 is what it asks for. Taking 0.9 here puts two copies of
# the crate in a `--features cuda` build - both backends of this one crate
# dlopen'ing through a different version of the same wrapper - for an API this
# module uses two names of (`Library`, `Symbol`). Raise it when `ash` does.
libloading = { version = "0.8", optional = true }

[features]
# CUDA is optional. Without its toolkit, the crate must compile and tests skip
# with an explicit message.
cuda = ["dep:libloading"]

[dev-dependencies]
rir-kernels.workspace = true
rir-lower.workspace = true
# The timing harness emits shaders in-process, so schedule changes require no
# generated artifact or fork rebuild.
rir-emit.workspace = true
# Timing tests and offline search share the same emit, build, and measurement
# path. The resulting dependency cycle is test-only and accepted by Cargo.
rir-sweep.workspace = true

[lints]
workspace = true
