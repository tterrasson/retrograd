# GRPO on the register machine, full finetuning: every eligible base tensor
# is trained and the run writes a standalone model. Same task, reward and
# data as `grpo.toml` — see README.md; what changes here is which parameters
# move.
#
# Run from the repository root:
# cargo run --release -- train examples/register_machine/grpo-full.toml
# cargo run --release -- bench examples/register_machine/grpo-full.toml

[run]
algorithm = "grpo"
verbose = false

[model]
# Must be an unquantized GGUF: `trainable = "full"` refuses a quantized file.
path = "../../models/LFM2.5-230M-F16.gguf"
device = "auto"

[output]
# Standalone GGUF (not the adapter bundle): the base file with the trained
# weights in it, written whole.
path = "/tmp/retrograd-register-machine-full.gguf"
kind = "model"

[training]
# No [lora] section and no [trainable] selector: that combination is "full".
trainable = "full"
ctx = 512
# micro_batch must hold the shared prompt plus several completions, or
# shared-prefix packing is refused.
micro_batch = 512
# Recompute activations instead of keeping them: buys back peak memory at
# the cost of a second forward.
gradient_checkpointing = true
# An order of magnitude below the LoRA run: the reward signal now moves the weights themselves
lr = 1e-7
# F32 master copy: the step is formed in F32 and stored by one cast, instead
# of rounding each update back onto the F16 grid. On with the F16 file above;
# "off" would be refused.
master_weights = "auto"
lr_scheduler = "cosine"
# Longer than the LoRA warmup: the first updates of a full run are the ones
# that can do unrecoverable damage.
warmup_steps = 20
weight_decay = 0.0
max_grad_norm = 1.0

[grpo]
prompts = "prompts.jsonl"
# 600 tasks written easy-first; `sequential` keeps that order.
prompt_order = "sequential"
reward_command = ["python3", "examples/register_machine/reward_server.py"]
updates = 100
prompts_per_update = 4
group_size = 8
# One pass: a second one is off-policy and moved this small model too far.
grpo_epochs = 1
clip_range_low = 0.2
clip_range_high = 0.28
# Off, as in the LoRA run. Enabling it needs a [reference] section: the base
# weights move, so this model with its adapter disabled is no longer the
# original policy.
kl_coefficient = 0.0
# A cut-off program scores 0, so truncated members stay in the group.
mask_truncated = false
# Whole groups that all score the same carry no signal: draw replacements.
max_stalled_updates = 25

[grpo.dynamic_sampling]
max_resample_factor = 3

[grpo.sampling]
# Dr. GRPO is strictly on-policy: temperature and top_p must both be 1.
temperature = 1.0
top_p = 1.0
# Longest shortest program is 5 commands plus slack: about 40 tokens.
max_new_tokens = 96
seed = 42

[evaluation]
data = "eval.jsonl"
every_iterations = 10
# Evenly spaced over a tier-by-tier file, so all three tiers stay in.
max_examples = 30
patience = 10
min_delta = 0.0

[checkpoint]
# Own directory: checkpoints carry base tensors here, not adapters.
directory = "/tmp/retrograd-register-machine-full-checkpoints"
# Only the best evaluation is kept; one checkpoint of a full run is model +
# optimizer state, so a `steps` cadence would fill the disk.
mode = "best_eval"

[metrics]
tensorboard_dir = "/tmp/retrograd-register-machine-full-tensorboard"

# Live export of the rollouts; open
# /tmp/retrograd-register-machine-full-observe/index.html.
[observe]
directory = "/tmp/retrograd-register-machine-full-observe"
every = 10
