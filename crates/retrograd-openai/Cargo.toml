[package]
name = "retrograd-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Retrograd - the OpenAI chat-completions contract over a Retrograd model"
publish = false

[dependencies]
# The SSE answer is one awaited completion followed by its chunks; a generator
# keeps the two halves in one readable sequence.
async-stream.workspace = true
async-trait.workspace = true
axum.workspace = true
futures-util.workspace = true
http.workspace = true
# The answers of a decision request, keyed in the order of its questions.
indexmap = "2"
# The rendering and the parsers the rollouts use, so what is served is what is
# trained - from `retrograd-agent-core`, not `retrograd-agent`: nothing here
# runs a tool, an environment or a judge, and the agent crate would drag all
# of them (MCP, containers, the trainer) into this one.
retrograd-agent-core = { workspace = true, features = ["template-parser"] }
retrograd-core.workspace = true
# `/v1/systemone`: the request, its validation and the answer of a decision
# model are that crate's; this one carries them over HTTP and the session.
retrograd-decision.workspace = true
retrograd-engine.workspace = true
retrograd-infer.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
