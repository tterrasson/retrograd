# The tiny decision model: a ModernBERT encoder with a `laya` decision head.
#
# Generated by `scripts/gen-tiny-decision-fixture.py`, so the digest below is a
# record of what that script (and the xorshift of `gen-tiny-fixture.py` it
# reuses) produces. Regenerating after editing either means updating `sha256`
# and `size_bytes` in the same commit.
#
# Architecture `modern-bert`, 2 encoder blocks and 1 decision-head block,
# n_embd 64, 4 heads, encoder FFN 96 (GEGLU with the erf GELU), head FFN 128
# (ReLU), sliding window 4 on encoder block 1, three question types, a
# 262-token byte-fallback vocabulary with `<mask>` and `<eos>` as the marker
# and separator, `decision.max_head_tokens = 64`, and a `systemone` template.
# Every tensor is F32: the finite-difference gradient tests read it, and a
# storage rounding would be noise in their differences.
