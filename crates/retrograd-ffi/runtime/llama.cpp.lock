# Upstream metadata for the Retrograd llama.cpp fork. The fork itself is the
# git submodule at runtime/vendor/llama.cpp (see .gitmodules); the pinned fork
# commit is the submodule gitlink recorded in this repository's history.
# This file only tracks the upstream base the fork descends from and the
# contribution status of each Retrograd patch.
upstream_url = "https://github.com/ggml-org/llama.cpp.git"
upstream_commit = "f072b103714dfa1eee531f80b24512faf38e3dd2"

[upstream_status]
# Contribution status of each Retrograd patch family.
# Each Retrograd commit below is intentionally independent so it can be rebased
# and proposed upstream without extracting a patch from this repository. That
# independence was paid for and, until F10, never cashed in: every entry read
# "local; upstream PR not opened", which says what has not happened and nothing
# about what should.
#
# Since the 2026-08-11 squash, the fork's history *is* this list: every commit
# on retrograd/main is named `retro(<family>): <what> [n/N]`, where <family> is
# a key below. Extract one with
#   git -C <fork> log --oneline --grep 'retro(<family>)' upstream/master..HEAD
# `[n/N]` marks a family written in several sittings and never re-ordered; the
# parts are contiguous in time, not adjacent in the log. Adding a family here
# without a commit that names it - or the reverse - is a bookkeeping bug.
# See RETRO_FORK.md at the root of the fork for the rest of the contract.
#
# One inline table per family, four keys, and the checker
# scripts/check-llama-cpp-integration.sh --upstream-status refuses an entry that
# omits any of them:
#
#   status  "upstream"   a PR exists (or upstream already carries it); `pr` says which
#           "proposable" belongs upstream, not proposed yet; `odds` ranks it
#           "retrograd"  specific to this product and will stay patch forever
#   odds    proposable only: high | medium | low - probability of *acceptance*,
#           not size. A backward pass for an op ggml already has defends itself;
#           a training-loop choice in llama-context.cpp does not.
#   probe   a symbol this family introduces that upstream does not have, checked
#           both ways by the script. The day it appears upstream, the family has
#           become redundant and the patch is free to delete - the "reuse before
#           writing" rule of §17, made mechanical. Empty when the family fixes
#           behaviour in existing code and adds no symbol: there the redundancy
#           signal is a rebase conflict, not a name, and the key says so.
#   why     the reason for the classification, in one sentence.
#
# The list bounds the objective as much as it drives it: a plan aiming at zero
# lines of patch would aim wrong, because the "retrograd" rows are never leaving.

training_graph_backward = { status = "proposable", odds = "high", probe = "", why = "fixes backward graph construction in ggml.c - a defect in shared code that defends itself and needs no new API; no symbol, so redundancy will show up as a rebase conflict" }
metal_backward_ops = { status = "upstream", pr = "https://github.com/ggml-org/llama.cpp/pull/25982", probe = "ggml_metal_op_out_prod", why = "SILU_BACK is upstream (the pinned base already carries it, so that part of the patch is gone); OUT_PROD and RMS_NORM_BACK on Metal remain, and RMS_NORM_BACK has since been taken over by RIR" }
metal_reduction_ops = { status = "proposable", odds = "high", probe = "ggml_metal_op_soft_max_back", why = "SOFT_MAX_BACK, CROSS_ENTROPY_LOSS(_BACK) and GET_ROWS_BACK on Metal: missing backend implementations for ops ggml already defines, exactly the kind of patch upstream accepts" }
metal_quantized_out_prod = { status = "proposable", odds = "medium", probe = "GGML_RETRO_DEQUANT_TYPES", why = "Metal OUT_PROD on a quantized src0 (Q8_0, Q2_K-Q6_K); the op exists upstream, but the patch also brings the table of dequantizable types, a convention to get accepted before the kernels" }
geglu_backward = { status = "proposable", odds = "high", probe = "", why = "26 lines in ggml.c: the backward of a GLU whose forward ggml already has, with no new API or op" }
masked_sft_labels = { status = "proposable", odds = "medium", probe = "ggml_opt_set_loss_active_rows", why = "a generic ggml-opt API (the number of active rows of a cross-entropy), motivated by an SFT need; upstream may want it, but it carries a product training intent" }
weighted_training_labels = { status = "retrograd", probe = "llama_opt_epoch_weighted", why = "policy-gradient objective exposed in llama.h: a product choice, not a capability llama.cpp is missing" }
ssm_scan_conv_backward = { status = "proposable", odds = "high", probe = "GGML_OP_SSM_CONV_BACK", why = "backward of SSM_CONV/SSM_SCAN/CONCAT, whose forwards upstream has: the same argument as metal_reduction_ops, on the core rather than on a backend" }
opt_rebind_backend_sched = { status = "proposable", odds = "high", probe = "ggml_opt_set_backend_sched", why = "one function, an obvious use case (the owner recreates its scheduler while the optimization context lives on) and no new semantics" }
training_graph_preflight = { status = "proposable", odds = "medium", probe = "ggml_opt_graph", why = "ggml_opt_graph alone is a defensible accessor; the llama-context preflight that consumes it is specific and should be proposed separately, or not at all" }
optimizer_scratch_reuse = { status = "proposable", odds = "medium", probe = "ggml_opt_set_graph_cache", why = "reuse of the optimizer scratch buffers: a measurable and generic gain, but it touches the lifetime of ggml-opt graphs - a long review for an optimization" }
optimizer_state_access = { status = "proposable", odds = "high", probe = "ggml_opt_set_rng_state", why = "reading and rewriting the optimizer state is the precondition for training checkpoints, a use case ggml-opt already claims" }
optimizer_descriptor = { status = "proposable", odds = "medium", probe = "ggml_opt_optimizer_slots", why = "an optimizer declares its persistent slots (name, dtype, shape, initializer) and the allocator, the initializer and the update graph all read that declaration instead of AdamW's two momenta; it also lets one run assign a different optimizer per parameter. Generic in substance - it is what ggml-opt would need for any third optimizer - but it replaces the momenta accessors and adds a callback to ggml_opt_params, so upstream will want to review the state model rather than the diff" }
backend_sampling_scalar_transfer = { status = "proposable", odds = "medium", probe = "", why = "avoids a host round trip on a fully offloaded sampling chain; a performance fix in llama-graph.cpp with no symbol - its redundancy will show up as a rebase conflict" }
cuda_training_ops = { status = "proposable", odds = "low", probe = "", why = "FA/SSM backward, quantized OUT_PROD and F16 AdamW on CUDA: proposable in substance, but it is the largest family of the set and will have to be split op by op before it is presentable" }
cuda_fused_sparse_ce = { status = "retrograd", probe = "fused-sparse-ce", why = "implements GGML_OP_FUSED_SPARSE_CE, an op that does not exist upstream: the family cannot leave before its op, and the op is a choice of this repository" }
target_logprobs_gather = { status = "proposable", odds = "low", probe = "llama_set_target_logprobs", why = "gathers log p(target) inside the graph so a teacher-forced scorer does not copy the vocabulary row; broadly useful, but it is one more llama.h API, and upstream rejects more of those than it accepts" }
# --- families added on 2026-08-11, when the fork history was realigned with
# this list. They had been in the code for weeks without being declared here:
# the squash made them visible, it did not create them.

unary_backward_ops = { status = "proposable", odds = "high", probe = "", why = "backward of TANH and GELU in the ggml_compute_backward switch: two ops whose forward upstream already has, no new API, the kind of patch upstream accepts most readily; no symbol, so redundancy will show up as a rebase conflict" }
optimizer_control = { status = "proposable", odds = "medium", probe = "llama_opt_timing", why = "gradient clipping (max_grad_norm), n_evals for a dynamic training duration, and timing instrumentation of the optimizer graph work; clipping defends itself upstream, the rest is a control surface designed for this product and should be proposed separately" }
training_perf_parallelism = { status = "retrograd", probe = "", why = "parallelism and memory tuning on the ops this fork adds - without those ops the patch has no upstream purpose; it will leave op by op with the families it speeds up, never alone" }
f16_adamw_kv_differentiable = { status = "proposable", odds = "medium", probe = "ggml_stochastic_round_f16", why = "F16 AdamW with stochastic rounding and a differentiable KV cache: stochastic rounding is a standalone, defensible contribution, but the differentiable KV cache touches llama-kv-cache and carries a training intent; to be split before proposing" }
training_loop_batching = { status = "retrograd", probe = "llama_opt_step_packed_sequences", why = "packed sequences and shared-prefix reuse: training-loop choices in llama-context, that is, product; llama.cpp has no training loop to propose them to" }
flash_attn_backward = { status = "proposable", odds = "medium", probe = "flash-attn-back.cuh", why = "flash attention backward on CPU, CUDA, Vulkan and Metal, with a differentiable F16 KV cache and head-dim up to 512; upstream has the forward and not the backward, so the substance is defensible, but it is four backends at once and will have to be split backend by backend" }
fused_sparse_ce = { status = "retrograd", probe = "GGML_OP_FUSED_SPARSE_CE", why = "implements an op upstream does not have (fused sparse cross-entropy over a possibly quantized projection, with a per-vocabulary bias and seq_chunk splitting); the family cannot leave before its op, and the op is a choice of this repository - same reason as cuda_fused_sparse_ce, of which it is the portable half" }
gradient_checkpointing = { status = "proposable", odds = "medium", probe = "ggml_opt_set_gradient_checkpoints", why = "recomputing activations instead of keeping them is a generic ggml-opt capability, but the API exposes a policy choice (which tensors, which kind of checkpoint) that upstream will probably want to redesign" }
gated_delta_net_backward = { status = "proposable", odds = "medium", probe = "GGML_OP_GATED_DELTA_NET_BACK", why = "backward of the gated delta net and L2_NORM_BACK, with the chunked variant on CPU/CUDA/Vulkan; upstream has the forward, so the argument holds, but it is a new GGML_OP and the rewrite of ggml_compute_forward_gated_delta_net that comes with it (1090 lines in ops.cpp) makes the review heavy" }
mul_backward_strided_fix = { status = "proposable", odds = "high", probe = "", why = "fixes an upstream defect: the MUL backward assumed contiguous gradients; a few lines in ggml.c, no API, exactly what upstream takes without discussion" }
retro_dequant_types = { status = "proposable", odds = "medium", probe = "ggml-retro-quant.h", why = "a single dequantization surface shared by CUDA, Metal and Vulkan instead of three diverging copies; useful upstream, but it is a convention (and a file generated by rir-gen) to get accepted before the kernels that use it - same dependency as metal_quantized_out_prod" }
out_prod_quant_tiling = { status = "proposable", odds = "medium", probe = "", why = "tiles quantized decodes to bound the OUT_PROD stack: a measurable optimization on upstream code, with no new symbol; can be proposed alone once retro_dequant_types is accepted" }
rir_integration = { status = "retrograd", probe = "ggml_rir_dispatch_begin", why = "selection chain, portable contract and registry for kernels compiled ahead of the build by rir-gen: upstream has no kernel compiler and does not want one; this family will never leave, and it is why the list does not aim at zero lines of patch" }
fork_footprint = { status = "retrograd", probe = "retro-ops.h", why = "moves the fork kernels out of upstream files (ggml-metal-retro.metal, ggml-cpu/retro-ops.cpp) so that each rebase has less conflict surface; this is fork hygiene and has no meaning upstream" }
fork_docs = { status = "retrograd", probe = "", why = "RETRO_FORK.md and the fork-owned AGENTS.md: they describe this repository, not llama.cpp" }
gradient_accumulation = { status = "retrograd", probe = "ggml_opt_abort_accumulation", why = "accumulates the gradients of packed sequences down into the recurrent memories of the Retrograd training loop; the generic ggml-opt API should be extracted before any upstream proposal" }
rir_shader_fixups = { status = "retrograd", probe = "", why = "fixes shared tile initialization and variable references in the shaders produced by RIR, a generator specific to Retrograd" }
rir_comment_translation = { status = "retrograd", probe = "", why = "turns the comments of this fork RIR registry into English, and resyncs the vendored artifacts with the output of their templates after the public docs were decoupled; no standalone upstream behaviour to propose" }
target_logprobs_reserve_index = { status = "retrograd", probe = "", why = "initializes the target log-probability index during graph reservation; this fix depends on the fork target_logprobs extension and cannot be proposed alone" }
vulkan_fused_sparse_ce_tiling = { status = "retrograd", probe = "", why = "tiles tokens in the Vulkan shaders of GGML_OP_FUSED_SPARSE_CE, a product op that does not exist upstream" }
rir_cumsum_parallel_scan = { status = "retrograd", probe = "rir_shared_scan_totals_v5", why = "unrolls the parallel scan of the RIR-generated CUMSUM kernel on Metal and Vulkan; the kernel compiler stays specific to Retrograd" }
cuda_out_prod_rank1 = { status = "proposable", odds = "medium", probe = "", why = "fixes the cuBLAS ldb of rank-1 OUT_PROD, a generic upstream defect, but the commit also carries the RIR census hook, which will have to be separated before proposing" }
cuda_rir_dispatch = { status = "retrograd", probe = "ggml_cuda_rir_launcher", why = "adds the CUDA launch infrastructure for the RIR compiler artifacts, which does not exist in upstream llama.cpp" }
cuda_rir_norm_backward = { status = "retrograd", probe = "ggml_cuda_rir_device_check", why = "wires the CUDA RIR kernels of L2_NORM_BACK and RMS_NORM_BACK and removes their native paths according to the Retrograd registry policy" }
cuda_rir_elementwise = { status = "retrograd", probe = "rir_launch_add_f16_vec4", why = "adds the RIR-generated CUDA artifacts for ADD, MUL, SCALE and UNARY, along with their Retrograd-specific registration" }
rir_extent_overflow = { status = "retrograd", probe = "", why = "saturates extent products in RIR selection to avoid an overflow; this dispatch path does not exist upstream" }
# --- families added on 2026-08-23, when six commits named outside the contract
# were renamed (and one of them split) so that the history and this list name
# the same families again.
rir_flat_linear = { status = "retrograd", probe = "ggml_rir_variant_fits_layout", why = "a variant can declare that the flattened index is the address (linear_addr), and selection refuses the declaration for a node whose layout does not hold it; this is a convention of the RIR registry and of the flat_linear CUDA artifacts it allows, so a path that does not exist upstream" }
# --- family added on 2026-08-31, when the architecture blocklist Retrograd kept
# on its side was replaced by a capability declared here.
packed_seq_capability = { status = "proposable", odds = "medium", probe = "llama_model_supports_packed_seq", why = "declares whether the graph of an architecture accepts a ubatch mixing several sequences; the family is purely additive - the GGML_ASSERT(ubatch.equal_seqs()) in src/models/ stay those of upstream, and the declaration is honoured at a single point, llama_context::packed_seq_supported(), at both entries of packed splitting; upstream has the same need on the server side (deciding on a mixed batch without knowing the architecture), but llama_decode_packed is one more llama.h API and will have to be proposed separately from the predicate" }

rir_pattern_census = { status = "retrograd", probe = "ggml_rir_census_pattern_snapshot", why = "counts the linear op chains seen by the RIR dispatch to guide kernel generation; this is instrumentation of the Retrograd-specific kernel compiler, with no upstream purpose" }

[upstream_bugs]
# Upstream defects found but not fixed here - noted so they are not rediscovered.
vulkan_row_grid_guard_norm_l2_norm = "present at upstream 6ea215d17; norm.comp and l2_norm.comp (forward) share the rms_norm_back defect above: same folded-grid `row`, no bound. Reproduced as sentinel mismatches on NORM/L2_NORM ne={65,600,1,1}. Not fixed here because their push constants (generic_unary_head) carry no row count, unlike KY - the fix needs a new field. RMS_NORM is unaffected (different pipeline and grid). sum_rows.comp / cumsum.comp look exposed by inspection but were not exercised."
