[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "retrograd"
version = "0.1.0"
description = "High-level Python API for the Retrograd Rust/llama.cpp runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Symlinks to the repository root: PEP 639 forbids `..` in `license-files`.
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/tterrasson/retrograd"
Repository = "https://github.com/tterrasson/retrograd"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "retrograd._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/retrograd"]

[tool.coverage.report]
show_missing = true

# Ruff reads the repository-wide `ruff.toml`, which also covers `examples/` and `scripts/`.
