[package]
name = "retrograd-training"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Retrograd - training algorithms: SFT, PPO, GRPO and distillation"
publish = false

[dependencies]
# The judge and its transport, for `[grpo.judge]`. Neither is new to the build:
# `retrograd-config` already links the declarations, and with them reqwest and
# tokio. What is new here is one runtime, owned by `rollout::judge`, which is
# where a synchronous training loop meets an asynchronous endpoint.
retrograd-agent-core.workspace = true
retrograd-config.workspace = true
retrograd-core.workspace = true
retrograd-dataset.workspace = true
retrograd-engine.workspace = true
retrograd-judge.workspace = true
retrograd-metrics.workspace = true
# The observer trait and its plain types, for `[observe]`.
retrograd-observe.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
tracing.workspace = true

[lints]
workspace = true
